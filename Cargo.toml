[workspace]
resolver = "2"
members = ["crates/gdpl-core", "crates/gdpl-hardware", "crates/gdpl-analyzer", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
